name: Gerar animação da cobrinha

on:
  schedule:
    - cron: "0 6 * * *" # todo dia às 03:00 (horário de Brasília)
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gerar SVGs a partir das suas contribuições
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#4D7C0F&color_dots=#ebedf0,#d9f99d,#a3e635,#65a30d,#3f6212
            dist/github-snake-dark.svg?color_snake=#A3E635&color_dots=#161b22,#1a2e05,#3f6212,#65a30d,#a3e635

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
